#
# Build TWRP for the Motorola Edge 70 Fusion (marvel)
#
# Method copied from the working OrangeFox workflow in
#   shripad-jyothinath/android_device_motorola_avenger @ ofrp
#   (.github/workflows/orangefox.yml)
#
#   * GitHub-hosted ubuntu-22.04 runner (NOT self-hosted)
#   * 12 GB swap file (16 GB RAM is not enough for Soong+ninja on its own)
#   * actions/cache for ~/.ccache
#   * repo launcher downloaded, `repo init --depth=1 --no-repo-verify`
#   * `repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags`
#   * build with a retry loop that re-pulls the device tree between attempts
#   * package a flashable zip and publish a GitHub release
#
# ---------------------------------------------------------------------------
# STORAGE - measured, not taken from the docs table
# ---------------------------------------------------------------------------
# GitHub documents the standard runner as "14 GB SSD". That is the *guaranteed*
# figure, not the real capacity. Measured on actual ubuntu-22.04/24.04 jobs:
#
#   /dev/root  mounted /     72-84 GB device, 16-19 GB free at job start
#   /dev/sda1  mounted /mnt  74 GB device,    ~66 GB free  (Azure temp disk)
#
#   godotengine/godot#80115  -> "/dev/root 84G 66G 19G 79% /"
#   cilium/cilium#39726      -> "/dev/root 72G 17G 55G 24% /" + "/dev/sda1 74G 4.1G 66G /mnt"
#   kserve/kserve#3411       -> "/dev/sdb1 74G 4.1G 66G /mnt"
#   thiagokokada/free-disk-space -> ubuntu-22.04: 16G free before -> 65G after
#   jlumbroso/free-disk-space    -> ~30 GB reclaimed (Android 10, toolcache 6, dotnet 4, ...)
#
# So after deleting the toolchains a recovery build never touches, a hosted
# runner really has ~50-65 GB on / AND ~66 GB on /mnt - roughly 115-130 GB.
# A TWRP-16 shallow sync (~30 GB) plus its build output (~25-40 GB) does not fit
# on either disk alone, but it does fit if the source goes on one and OUT_DIR on
# the other. That is what the "Choose build directories" step does.
#
# Caveats handled there:
#   * on some runner classes /mnt is NOT a separate device (it is a directory on
#     /dev/root) - detect with `stat -c %d` and never count the space twice
#   * /mnt has been seen 100% full out of the box (actions/runner#3968)
#   * the 12 GB swapfile is placed on the larger disk so it does not eat the
#     space the build needs
#
# What is genuinely tight on a hosted runner is TIME (4 vCPU, 6 h hard cap),
# not space. If the build does not finish, switch to the self-hosted runner via
# the `runner` input (see README).
#
# GitHub Free quotas that shape this workflow (docs.github.com/actions/reference/limits):
#   * cache storage 10 GB per repository -> ccache capped at 3 GB
#   * artifact storage 500 MB total      -> only logs are uploaded as artifacts,
#                                           the image itself goes to a Release
#

name: Build TWRP

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner labels as JSON"
        required: true
        # the proven hosted runner; self-hosted is the fallback plan
        default: '["ubuntu-22.04"]'
        type: string
      release:
        description: "AOSP release config (Android 16 trees only; ignored on twrp-14.1)"
        required: false
        default: ap2a
        type: choice
        options: [ap2a, ap3a, ap4a, bp1a, bp2a]
      branch:
        description: "TWRP manifest branch (twrp-16.0 = TWRP-Test Android 16 line; twrp-14.1 = official TeamWin)"
        required: false
        default: twrp-16.0
        type: string
      manifest:
        description: "TWRP manifest URL (blank = TWRP-Test twrp-16.0 manifest)"
        required: false
        default: ""
        type: string
      jobs:
        description: "make -j (default 3; the runner has 4 vCPU / 16 GB, -j4 plus soong peaks past RAM)"
        required: false
        default: "3"
        type: string
      retries:
        description: "build attempts (hosted runners: leave at 1, the 6 h job cap is the limit)"
        required: false
        default: "1"
        type: string
  push:
    branches: [master]
    tags: ["v*"]

# NOTE: there is deliberately no `concurrency:` block here (the ofrp job has none
# either). With one, a second push queues behind a running build - which cost 50
# minutes on the first attempt because a failed job sat in its post-steps and
# never released the slot. Iterating on a device tree needs "every push gets its
# own run" more than it needs serialisation.

permissions:
  contents: write

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    # `inputs` is empty on push events, so the fallback matters
    runs-on: ${{ fromJSON(inputs.runner || '["ubuntu-22.04"]') }}
    # 360 min is the hard ceiling for GitHub-hosted runners; leave slack so the
    # log-collection step still gets to run after a timeout.
    timeout-minutes: 355

    env:
      DEVICE: marvel
      # Manifest: twrp-16.0 (Android 16) from the TWRP-Test org.
      #
      # OFFICIALNESS, checked: this is NOT an official TeamWin branch. TeamWin's
      # newest is android-14.1 (TeamWin/android_build, TeamWin/android_bootable_recovery),
      # and the official minimal manifest
      # (minimal-manifest-twrp/platform_manifest_twrp_aosp) tops out at twrp-14.1.
      # TWRP-Test is a separate org - created 2025-06, 39 repos, 18 followers, no
      # name/blog, and its repos are NOT forks of TeamWin's (fork:false,
      # parent:none). Its twrp-16.0 commits are authored by TWRP contributors
      # (Col_or, lingqiqi233, YuKongA), so it is a dev-authored testing line
      # rather than an official release line.
      #
      # It is used because it is the only line carrying the Android 16
      # keymint/weaver decryption stack, which is what marvel needs. The official
      # twrp-14.1 line stays selectable through the `branch` / `manifest` inputs
      # (the device tree then also needs COMMON_LUNCH_CHOICES := twrp_marvel-eng).
      #
      # Lunch form differs: Android 16 (>= twrp-15) uses
      # <product>-<release>-<variant>; the official 14.1 line uses
      # <product>-<variant>. The build step picks by branch version and
      # AndroidProducts.mk must match (currently twrp_marvel-ap2a-eng).
      TWRP_BRANCH: ${{ inputs.branch || 'twrp-16.0' }}
      MANIFEST: ${{ inputs.manifest || 'https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git' }}
      RELEASE: ${{ inputs.release || 'ap2a' }}
      RETRIES: ${{ inputs.retries || '1' }}
      # 24GiB was carried over from the 64 GB ServerHive box and is actively
      # harmful here: GOMEMLIMIT is a *soft* limit for Go's GC, so setting it
      # above the machine's RAM tells soong_build to stop collecting garbage
      # before it is anywhere near the ceiling. On a 16 GB runner that means the
      # analysis pass balloons and the kernel OOM-killer takes the runner down
      # with it - which is what "all steps concluded but the job never completes"
      # looks like. Keep this below physical RAM.
      GOMEMLIMIT: 6GiB
      LOG_DIR: ${{ github.workspace }}/logs

    steps:
      - name: Check Out
        uses: actions/checkout@v4
        with:
          path: device-tree
          fetch-depth: 1

      # ------------------------------------------------------- runner report
      - name: Probe runner
        run: |
          echo "runner : $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          echo "cpus   : $(nproc)"
          echo
          free -h || true
          echo
          df -hT / /mnt 2>/dev/null || df -hT /
          echo
          lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINT 2>/dev/null || true
          echo
          # these two numbers decide where the source and the out dir go
          echo "/   device: $(stat -c %d /)"
          echo "/mnt device: $(stat -c %d /mnt 2>/dev/null || echo missing)"

      # ------------------------------------------------------- disk reclaiming
      # The Android SDK/NDK, the hosted tool cache, .NET etc. are never used by
      # an AOSP build. This is the biggest single lever on a hosted runner.
      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/share/powershell /usr/local/lib/node_modules || true
          sudo rm -rf /usr/share/swift /usr/share/miniconda || true
          sudo rm -rf /opt/microsoft/msedge /opt/google/chrome /usr/local/share/chromium || true
          sudo rm -rf /usr/lib/jvm/* || true
          sudo apt-get clean
          df -hT / /mnt 2>/dev/null || df -hT /

      # ------------------------------------------------- pick the build dirs
      # The source tree and the out dir are both huge; put them on different
      # disks when the runner has two. Fails fast (with instructions) if there
      # is not enough space, instead of dying 3 h into the build.
      - name: Choose build directories
        run: |
          set -euo pipefail

          ROOT_DEV=$(stat -c %d /)
          MNT_SEPARATE=0
          if [ -d /mnt ] && [ "$(stat -c %d /mnt 2>/dev/null)" != "$ROOT_DEV" ]; then
            MNT_SEPARATE=1
          fi

          ROOT_FREE=$(df -Pk / | awk 'NR==2{print $4}')
          MNT_FREE=0
          if [ "$MNT_SEPARATE" = 1 ]; then
            MNT_FREE=$(df -Pk /mnt | awk 'NR==2{print $4}')
            # /mnt has been observed 100% full out of the box (actions/runner#3968);
            # if it is too small to be useful, pretend it is not there at all
            if [ "$MNT_FREE" -lt $((20 * 1048576)) ]; then
              echo "::warning::/mnt is a separate device but only $((MNT_FREE / 1048576)) GB free - ignoring it"
              MNT_SEPARATE=0
              MNT_FREE=0
            fi
          fi

          GB=1048576
          # MEASURED, first real run: the shallow (-c --depth=1) twrp-16.0 tree is
          # 74 GB on disk, so the original 30 GB estimate was badly wrong. A cold
          # recoveryimage build adds ~25-40 GB of out/.
          #
          # The manifest also ships remove-minimal.xml, which drops 607 projects
          # (cts, kernel prebuilts 6.1/6.6/6.12, device/generic/*, 311 unused
          # external/*) and keeps every project the recovery build needs - checked
          # against vendor/twrp/config/packages.mk and the module list. That gets
          # the tree to roughly 40-50 GB, and it also shrinks soong's analysis
          # (fewer Android.bp files to parse = less RAM on a 16 GB runner).
          FULL_SRC=$((80 * GB));  FULL_OUT=$((25 * GB));  FULL_SHARED=$((105 * GB))
          TRIM_SRC=$((45 * GB));  TRIM_OUT=$((25 * GB));  TRIM_SHARED=$((75 * GB))

          # choose a layout for the given requirements; returns 0 if it fits
          choose() {
            local min_src=$1 min_out=$2 min_shared=$3
            if [ "$MNT_SEPARATE" = 1 ] && [ "$MNT_FREE" -gt "$ROOT_FREE" ]; then
              SRC_ROOT=/mnt/fox; SRC_FREE=$MNT_FREE; OUT_DIR=/out
              OUT_FREE=$ROOT_FREE; SWAP_DIR=/mnt
            else
              SRC_ROOT="$GITHUB_WORKSPACE/fox"; SRC_FREE=$ROOT_FREE
              OUT_DIR=/mnt/out; OUT_FREE=$MNT_FREE; SWAP_DIR=/mnt
              if [ "$MNT_SEPARATE" = 0 ]; then OUT_DIR=""; OUT_FREE=0; SWAP_DIR=/; fi
            fi
            # if the second disk cannot hold the output on its own, keep out/
            # next to the source rather than filling that disk and dying later
            if [ -n "$OUT_DIR" ] && [ "$OUT_FREE" -lt "$min_out" ]; then
              OUT_DIR=""; OUT_FREE=0
            fi
            NEED=$min_shared
            if [ -n "$OUT_DIR" ]; then NEED=$min_src; fi
            [ "$SRC_FREE" -ge "$NEED" ]
          }

          # The binding constraint on a 16 GB runner is NOT disk, it is soong's
          # Android.bp analysis: soong_build parses every project in the tree, and
          # that live set is what pushes the machine into swap and gets the runner
          # shut down. Evidence from run 37232604397: the bootstrap finished
          # ("[99% 131/132] cp .../soong_build"), then two minutes of silence while
          # soong_build analysed, then
          #   Process completed with exit code 143.   (SIGTERM)
          #   The runner has received a shutdown signal.
          # remove-minimal.xml takes 990 projects to 383, which is the one lever
          # that actually shrinks that peak. So trim whenever RAM is short, not
          # only when the disk is.
          MEM_GB=$(awk '/MemTotal/{print int($2/1048576)}' /proc/meminfo 2>/dev/null || true)
          MEM_GB=${MEM_GB:-16}
          TRIM=0
          if [ "$MEM_GB" -lt 32 ]; then
            echo "::warning::runner has ${MEM_GB} GB RAM (<32) - trimming the tree so soong's analysis fits"
            TRIM=1
            choose "$TRIM_SRC" "$TRIM_OUT" "$TRIM_SHARED" || true
          elif ! choose "$FULL_SRC" "$FULL_OUT" "$FULL_SHARED"; then
            echo "::warning::not enough disk for the full 74 GB tree here - enabling the remove-minimal.xml overlay"
            if choose "$TRIM_SRC" "$TRIM_OUT" "$TRIM_SHARED"; then
              TRIM=1
            fi
          fi

          # the runner user does not own /mnt or /
          sudo mkdir -p "$SRC_ROOT"
          sudo chown "$(id -u):$(id -g)" "$SRC_ROOT"
          if [ -n "$OUT_DIR" ]; then
            sudo mkdir -p "$OUT_DIR"
            sudo chown "$(id -u):$(id -g)" "$OUT_DIR"
          fi

          # IMPORTANT: only export OUT_DIR when we actually relocate it. Exporting
          # `OUT_DIR=` (empty but *set*) breaks the build system, and it looks
          # harmless in the env dump:
          #   build/soong/ui/build/config.go does
          #       if outDir, ok := ret.environ.Get("OUT_DIR"); ok {
          #           ... filepath.Clean(outDir) ...
          #   ok is true for an empty value, and filepath.Clean("") == ".", so
          #   OUT_DIR resolves to the SOURCE ROOT. SetupOutDir() then fails with
          #   "…/fox/.out-dir must not exist" and the paths step never writes
          #   out/.module_paths/AndroidProducts.mk.list. product_config.mk reads
          #   that file to find AndroidProducts.mk, so with it missing lunch says
          #   "Don't have a product spec for: 'twrp_marvel'" and the device is
          #   looked up on GitHub instead. An absolute, non-empty OUT_DIR is fine.
          {
            echo "SRC_ROOT=$SRC_ROOT"
            echo "SWAP_DIR=$SWAP_DIR"
            echo "TRIM=$TRIM"
          } >> "$GITHUB_ENV"
          if [ -n "$OUT_DIR" ]; then
            echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          fi

          TOTAL_GB=$(( (ROOT_FREE + MNT_FREE) / GB ))
          {
            echo "### Build plan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| source | \`$SRC_ROOT\` ($((SRC_FREE / GB)) GB free) |"
            echo "| OUT_DIR | \`${OUT_DIR:-<src>/out}\` ($((OUT_FREE / GB)) GB free) |"
            echo "| swap | \`$SWAP_DIR/swapfile\` |"
            echo "| free on / | $((ROOT_FREE / GB)) GB |"
            echo "| free on /mnt | $((MNT_FREE / GB)) GB (separate device: $MNT_SEPARATE) |"
            echo "| **total usable** | **${TOTAL_GB} GB** |"
            echo "| trimmed sync | $TRIM (remove-minimal.xml overlay) |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "source=$SRC_ROOT (${SRC_FREE} bytes free, needs ${NEED})"
          echo "out=${OUT_DIR:-<src>/out} swap=$SWAP_DIR total=${TOTAL_GB}GB trim=$TRIM ram=${MEM_GB}GB"
          echo "root=$((ROOT_FREE / GB))GB mnt=$((MNT_FREE / GB))GB separate=$MNT_SEPARATE"

          if [ "$SRC_FREE" -lt "$NEED" ]; then
            echo "::error::not enough disk for an AOSP-16 recovery build: $((SRC_FREE / GB)) GB free where the"
            echo "::error::source tree has to live, ~$((NEED / GB)) GB needed even with the trimmed tree."
            echo "::error::Options, in order of preference:"
            echo "::error::  1. re-run and hope for a larger runner image (146 GB disks have been seen)"
            echo "::error::  2. runner = [\"self-hosted\",\"linux\",\"x64\"] on a machine with >=150 GB"
            exit 1
          fi
          if [ "$TOTAL_GB" -lt 110 ]; then
            echo "::warning::${TOTAL_GB} GB usable is tight for an AOSP-16 recovery build; if it runs"
            echo "::warning::out of disk, see the options in the README."
          fi

      # ------------------------------------------------------------- swapfile
      # Same purpose as pierotofy/set-swap-space, done inline so there is no
      # unpinned third-party action in the build path. 16 GB RAM alone OOMs
      # during Soong/ninja.
      - name: Set Swap Space (12 GB)
        run: |
          set -uo pipefail
          if [ "$(swapon --show --noheadings | wc -l)" -gt 0 ]; then
            echo "swap already active:"; swapon --show; free -h; exit 0
          fi
          SWAPFILE="$SWAP_DIR/swapfile"
          sudo fallocate -l 12G "$SWAPFILE" 2>/dev/null \
            || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=12288 status=none
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE" >/dev/null
          if ! sudo swapon "$SWAPFILE" 2>/dev/null; then
            # e.g. tmpfs or btrfs where a swapfile is not allowed - fall back
            echo "::warning::could not swapon $SWAPFILE, falling back to /swapfile"
            sudo rm -f "$SWAPFILE"
            sudo fallocate -l 12G /swapfile 2>/dev/null \
              || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288 status=none
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile >/dev/null
            sudo swapon /swapfile
          fi
          swapon --show
          free -h

      # --------------------------------------------------------- build deps
      - name: Prepare Build Environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git-core gnupg flex bison build-essential zip unzip curl \
            zlib1g-dev libc6-dev-i386 libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2 libxml2-utils xsltproc fontconfig libssl-dev bc rsync python3 jq ccache
          # present on 22.04, dropped or renamed in 24.04 - never fatal
          sudo apt-get install -y libncurses5 libncurses-dev x11proto-core-dev || true

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          # Android 16 needs 17 (the ofrp job uses 8 because it is a 12.1 tree)
          java-version: "17"

      - name: Install Git-Repo
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          repo --version | head -1

      # --------------------------------------------------------- ccache cache
      # NOTE: the repository cache quota is 10 GB total, so do not let ccache
      # grow past a few GB or it evicts itself every run.
      - name: Setup Ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-twrp16-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-twrp16-ccache-

      # ------------------------------------------------------------- manifest
      - name: Initialize TWRP Manifest (SHALLOW)
        run: |
          set -euo pipefail
          mkdir -p "$SRC_ROOT" && cd "$SRC_ROOT"
          git config --global user.name  "shripad-jyothinath"
          git config --global user.email "shripad-jyothinath@users.noreply.github.com"
          git config --global --add safe.directory '*'
          repo init --depth=1 -u "$MANIFEST" -b "$TWRP_BRANCH" --no-repo-verify
          git -C .repo/manifests log -1 --oneline

          # NOTE on trimming: two attempts to *restrict the sync* both failed and
          # both are documented here so nobody retries them:
          #   - an <include> overlay in .repo/local_manifests/ (run 37280474963):
          #     `repo sync` failed instantly, tree came out 19 MB
          #   - parsing `repo manifest` with grep 'path="..."' (run 37282570785):
          #     repo OMITS path= when path == name, so only 387 of 990 projects were
          #     listed, `toolchain/pgo-profiles` was never synced, and build/make
          #     died with "toolchain/pgo-profiles/sampling/afdo_profiles.mk: No such
          #     file or directory"
          # The trim is therefore done AFTER the sync, by deleting directories, with
          # assertions that the build's prerequisites survived. A wrong path there
          # matches nothing, so the worst case is "no trim" rather than a broken tree.
          echo "manifest projects: $(repo manifest | grep -c '<project ')"

      - name: Sync Source (SHALLOW)
        run: |
          set -uo pipefail
          mkdir -p "$LOG_DIR"
          cd "$SRC_ROOT"

          # tee'd into the log artifact: when this step fails, the repo error is
          # the only thing that explains it (run 37280474963 failed here and the
          # collected logs had nothing because there was no build.log yet)
          repo sync -c -j"$(nproc --all)" \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune 2>&1 | tee "$LOG_DIR/sync.log"

          # ------------------------------------------------------------------ trim
          # Delete the projects remove-minimal.xml lists, after the sync, then prove
          # the build's prerequisites survived. Worst case (a path that matches
          # nothing) is simply "no trim".
          if [ "${TRIM:-0}" = 1 ]; then
            grep -oE 'path="[^"]+"' .repo/manifests/remove-minimal.xml \
              | sed 's/^path="//; s/"$//' | sort -u > /tmp/drop-paths.txt
            echo "trim: remove-minimal.xml lists $(wc -l < /tmp/drop-paths.txt) project paths"
            DROPPED=0
            while IFS= read -r p; do
              if [ -n "$p" ] && [ -d "$p" ]; then
                rm -rf -- "$p" && DROPPED=$((DROPPED + 1))
              fi
            done < /tmp/drop-paths.txt
            echo "trim: deleted $DROPPED project directories"
            # The build's own prerequisites must still be there. toolchain/pgo-profiles
            # is the one that bit us: build/make/core/soong_config.mk includes
            # toolchain/pgo-profiles/sampling/afdo_profiles.mk unconditionally.
            for p in build/make build/soong bootable/recovery vendor/twrp system/core \
                     bionic frameworks/base hardware/interfaces toolchain/pgo-profiles \
                     prebuilts/clang/host/linux-x86 device/qcom/common device/qcom/twrp-common \
                     system/extras system/vold system/security system/keymaster; do
              if [ ! -d "$p" ]; then
                echo "::error::trim removed a required project: $p"
                exit 1
              fi
            done
            echo "trim: all required projects present"
          else
            echo "no trim"
          fi

          echo "--- source size ---"
          du -sh "$SRC_ROOT" | tail -1
          df -hT / /mnt 2>/dev/null || df -hT /

      - name: Install Device Tree
        run: |
          set -euo pipefail
          DEST="$SRC_ROOT/device/motorola/$DEVICE"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          rsync -a --exclude '.git' --exclude '.github' device-tree/ "$DEST/"
          echo "COMMIT_ID=$(git -C device-tree rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "--- prebuilts ---"
          ls -la "$DEST/prebuilt" 2>/dev/null || true
          echo "--- recovery/root files: $(find "$DEST/recovery/root" -type f | wc -l)"

      # ---------------------------------------------------------------- build
      - name: Build TWRP Recovery
        timeout-minutes: 290
        run: |
          set -o pipefail
          cd "$SRC_ROOT"
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_EXEC="$(command -v ccache)"
          export LC_ALL=C
          # TWRP device trees routinely reference modules the recovery product
          # does not pull in; this is what TWRP's own build guide sets.
          export ALLOW_MISSING_DEPENDENCIES=true
          ccache -M 3G >/dev/null || true

          # see the OUT_DIR note in "Choose build directories" - an empty but set
          # OUT_DIR resolves to the source root inside soong and kills the build
          if [ -n "${OUT_DIR:-}" ]; then
            export OUT_DIR
            echo "OUT_DIR=$OUT_DIR"
          else
            unset OUT_DIR
            echo "OUT_DIR=<unset - AOSP will use \$SRC_ROOT/out>"
          fi
          LOG="$LOG_DIR/build.log"
          mkdir -p "$LOG_DIR"

          JOBS="${{ inputs.jobs }}"; [ -n "$JOBS" ] || JOBS="$(nproc --all)"
          echo "OEM_COMPILE_JOBS=$JOBS"
          echo "GOMEMLIMIT=$GOMEMLIMIT (must stay below physical RAM: it is a soft GC"
          echo "  limit, and above RAM it stops soong_build collecting garbage)"
          free -h || true
          ATTEMPT=1
          SUCCESS=0
          while [ "$ATTEMPT" -le "$RETRIES" ]; do
            echo "========================================================"
            echo "Attempt #$ATTEMPT / $RETRIES  (-j$JOBS)"
            echo "========================================================"
            # shellcheck disable=SC1091
            source build/envsetup.sh
            # NOTE: `lunch` must NOT run in a pipeline - it sets TARGET_PRODUCT /
            # TARGET_RELEASE / TARGET_BUILD_VARIANT, and a pipeline would run it in a
            # subshell whose environment mka would never see.
            #
            # Lunch form depends on the manifest branch: Android 16 (>= twrp-15)
            # takes <product>-<release>-<variant>, the official 14.1 line takes
            # <product>-<variant>. Getting this wrong makes lunch try to fetch the
            # device from GitHub, which is slow and writes a roomservice manifest.
            BR_VER="${TWRP_BRANCH#twrp-}"
            BR_MAJOR="${BR_VER%%.*}"
            if [ "${BR_MAJOR:-0}" -ge 15 ] 2>/dev/null; then
              LUNCH="twrp_${DEVICE}-${RELEASE}-eng"
            else
              LUNCH="twrp_${DEVICE}-eng"
            fi
            echo "lunching: $LUNCH   (branch $TWRP_BRANCH)"
            if ! lunch "$LUNCH" >>"$LOG" 2>&1; then
              echo "::warning::lunch $LUNCH failed, trying the other form"
              lunch "twrp_${DEVICE}-${RELEASE}-eng" >>"$LOG" 2>&1 \
                || lunch "twrp_${DEVICE}-eng" >>"$LOG" 2>&1 || true
            fi
            echo "resolved: TARGET_PRODUCT=$TARGET_PRODUCT TARGET_RELEASE=$TARGET_RELEASE TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT" | tee -a "$LOG"
            if mka recoveryimage -j"$JOBS" 2>&1 | tee -a "$LOG"; then
              SUCCESS=1
              echo "Build finished successfully!"
              break
            fi
            echo "Build failed on attempt #$ATTEMPT."
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$RETRIES" ]; then
              # re-pull the device tree in case a fix was pushed while building
              echo "Re-pulling device tree from origin..."
              cd "$GITHUB_WORKSPACE/device-tree"
              git fetch --depth=1 origin "${GITHUB_REF_NAME}" || true
              git reset --hard FETCH_HEAD || true
              rsync -a --delete --exclude '.git' --exclude '.github' \
                "$GITHUB_WORKSPACE/device-tree/" "$SRC_ROOT/device/motorola/$DEVICE/"
              cd "$SRC_ROOT"
            fi
          done
          [ "$SUCCESS" -eq 1 ] || { echo "::error::all $RETRIES attempts failed"; exit 1; }

          ccache -s | head -12 || true
          echo "--- disk after the build ---"
          df -hT / /mnt 2>/dev/null || df -hT /
          echo "--- outputs ---"
          ls -la "${OUT_DIR:-$SRC_ROOT/out}/target/product/$DEVICE/recovery.img" \
                 "${OUT_DIR:-$SRC_ROOT/out}/target/product/$DEVICE/ramdisk-recovery.img" 2>/dev/null || true

      # --------------------------------------------------------------- verify
      - name: Verify recovery.img
        run: |
          set -euo pipefail
          OUT="${OUT_DIR:-$SRC_ROOT/out}"
          python3 - "$OUT/target/product/$DEVICE/recovery.img" <<'PY'
          import hashlib, pathlib, struct, sys
          p = pathlib.Path(sys.argv[1])
          if not p.is_file():
              sys.exit(f"::error::recovery.img not found at {p}")
          d = p.read_bytes()
          assert d[:8] == b"ANDROID!", "not an Android boot image"
          ks = struct.unpack_from("<I", d, 8)[0]
          rs = struct.unpack_from("<I", d, 12)[0]
          hv = struct.unpack_from("<I", d, 40)[0]
          print(f"header_version={hv} kernel_size={ks} ramdisk_size={rs} size={len(d)}")
          print("sha256:", hashlib.sha256(d).hexdigest())
          if ks != 0:
              print("::warning::kernel_size != 0 - marvel's ABL expects a kernel-less recovery image")
          if len(d) > 134217728:
              sys.exit("::error::image is bigger than the 128 MB recovery partition")
          PY

      # ----------------------------------------------------------- build logs
      # Kept tiny on purpose: GitHub Free only includes 500 MB of artifact
      # storage for the whole account, and the image itself goes to a Release.
      - name: Collect build logs
        if: always()
        run: |
          mkdir -p "$LOG_DIR"
          if [ -f "$LOG_DIR/build.log" ]; then
            head -n 300 "$LOG_DIR/build.log" > "$LOG_DIR/build.log.head" || true
            tail -n 4000 "$LOG_DIR/build.log" > "$LOG_DIR/build.log.tail" || true
            grep -nE "error:|Error:|FAILED:|ninja: build stopped|Killed signal|No space left|not found|unknown target|is not a valid" \
              "$LOG_DIR/build.log" | tail -n 300 > "$LOG_DIR/build.errors.txt" || true
          fi
          if [ -f "$LOG_DIR/sync.log" ]; then
            tail -n 400 "$LOG_DIR/sync.log" > "$LOG_DIR/sync.log.tail" || true
            grep -nE "error|fatal|Traceback|not found" "$LOG_DIR/sync.log" | tail -n 100 \
              > "$LOG_DIR/sync.errors.txt" || true
          fi
          OUT="${OUT_DIR:-$SRC_ROOT/out}"
          {
            echo "--- disk ---"; df -hT / /mnt 2>/dev/null || df -hT /
            echo "--- memory ---"; free -h
            echo "--- sizes ---"; du -sh "$SRC_ROOT" "$OUT" "$HOME/.ccache" 2>/dev/null
          } > "$LOG_DIR/build.stats.txt" || true
          # OOM evidence. "All steps concluded but the job never completes" is what
          # a runner that got killed looks like from the API, and the kernel says
          # so here. dmesg needs root; the runner has passwordless sudo.
          sudo dmesg 2>/dev/null | tail -n 150 > "$LOG_DIR/build.dmesg.txt" || true
          grep -iE "out of memory|oom-kill|killed process|invoked oom" "$LOG_DIR/build.dmesg.txt" \
            > "$LOG_DIR/build.oom.txt" 2>/dev/null || true
          ls -la "$LOG_DIR"
          wc -c "$LOG_DIR"/* || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ env.DEVICE }}-logs-${{ github.run_number }}
          path: ${{ env.LOG_DIR }}
          if-no-files-found: ignore
          retention-days: 14

      # ----------------------------------------------------------- artifacts
      - name: Package Artifacts
        run: |
          set -euo pipefail
          OUT="${OUT_DIR:-$SRC_ROOT/out}"
          P="$GITHUB_WORKSPACE/release_assets"
          mkdir -p "$P"
          cp "$OUT/target/product/$DEVICE/recovery.img" "$P/"
          cp "$OUT/target/product/$DEVICE/ramdisk-recovery.img" "$P/" 2>/dev/null || true
          cp "$OUT/target/product/$DEVICE/recovery/root/system/etc/recovery.fstab" "$P/recovery.fstab" 2>/dev/null || true
          cd "$P"
          sha256sum recovery.img > recovery.img.sha256
          # flashable zip (fastboot image + hash), same idea as the ofrp job
          zip -9 -q twrp-marvel-recovery.zip recovery.img recovery.img.sha256 || true
          ls -lah
          {
            echo "### Result"
            echo ""
            echo '```'
            cat recovery.img.sha256
            ls -l recovery.img | awk '{print $5" bytes"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/recovery.img
            release_assets/recovery.img.sha256
            release_assets/twrp-marvel-recovery.zip
            release_assets/ramdisk-recovery.img
          name: TWRP for Moto Edge 70 Fusion (${{ env.RELEASE }} #${{ github.run_number }})
          tag_name: twrp-${{ github.run_id }}
          body: |
            TWRP recovery for **Motorola Edge 70 Fusion** (`marvel`, XT2605)

            * TWRP manifest: `twrp-16.0` (AOSP `android-16.0.0_r1`)
            * release config: `${{ env.RELEASE }}`
            * device tree commit: `${{ env.COMMIT_ID }}`
            * `recovery.img` is ramdisk-only (`kernel_size = 0`) - required by marvel's ABL

            ### Flashing
            ```
            fastboot flash recovery recovery.img
            ```
            Then boot recovery from the bootloader menu (Power + Volume Down -> Recovery mode).
            Only the recovery partition is touched; boot / init_boot / vendor_boot stay stock.
